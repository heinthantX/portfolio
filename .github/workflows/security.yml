name: Security Scan

# Fails only on high/critical findings. Runs on PRs and pushes to main,
# plus weekly so new advisories surface without a code change.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 2 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dependency-audit:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: pnpm audit (prod, high+)
        run: pnpm audit --prod --audit-level high

  # Scans only the commits a PR or push adds.
  gitleaks:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-24.04
    container:
      image: zricethezav/gitleaks:v8.28.0
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks (new commits)
        env:
          RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          gitleaks git . --no-banner --redact --log-opts="$RANGE"

  semgrep:
    runs-on: ubuntu-24.04
    container:
      image: semgrep/semgrep:1.140.0
    steps:
      - uses: actions/checkout@v4
      # --severity ERROR = high only. Mark reviewed false positives with a
      # `// nosemgrep: <rule-id>` comment on the line, with a reason.
      - name: semgrep (ERROR severity)
        run: |
          semgrep scan \
            --config p/typescript --config p/react --config p/nextjs --config p/secrets \
            --severity ERROR --error --metrics off \
            src scripts
